# Optional local hooks use the same pinned checks as CI.
repos:
    - repo: local
      hooks:
          - id: peios-style
            name: Peios source style
            entry: python3 tools/style-check.py
            language: system
            pass_filenames: false
          - id: peios-check
            name: Peios build and tests
            entry: tools/check
            language: system
            pass_filenames: false
            stages: [pre-push]
