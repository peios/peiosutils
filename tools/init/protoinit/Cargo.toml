[package]
name        = "protoinit"
version     = "0.0.1"
description = "Peios Phase 0 PID 1 stub: mounts /proc /sys /dev and execs /bin/sh"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "protoinit"
path = "src/main.rs"

[package.metadata.peios]
# PSD-009 §3.4.1: /init isn't a permitted install destination. protoinit is
# spec-installed at usr/bin/protoinit; peios-image's initramfs path uses the
# kernel's `init=/usr/bin/protoinit` cmdline arg to find it instead of a /init
# symlink, so no compat shim is needed.
install_path = "usr/bin/protoinit"
