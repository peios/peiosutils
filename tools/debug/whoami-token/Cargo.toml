[package]
name        = "whoami-token"
version     = "0.0.1"
description = "Dump the calling process's KACS access token (validation tool)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "whoami-token"
path = "src/main.rs"

[dependencies]
peios-uapi.workspace = true

[package.metadata.peios]
install_path = "bin/whoami-token"
