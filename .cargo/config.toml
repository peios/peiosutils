# Note: keep in mind that this file is completely ignored in several use-cases
# like e.g. out-of-tree builds ( https://github.com/rust-lang/cargo/issues/2930 ).
# For this reason this file should be avoided as much as possible when there are alternatives.

[target.x86_64-unknown-redox]
linker = "x86_64-unknown-redox-gcc"
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# See feat_external_libstdbuf in src/uu/stdbuf/Cargo.toml
LIBSTDBUF_DIR = "/usr/local/libexec/coreutils"

# libpeios is vendored under deps/ (headers + .so/.a) until the build root can
# provide it as a package (glibc + libpeios live in pkgs/). peios-sys's build.rs
# reads these to bindgen against the headers and link the runtime .so. Paths are
# relative to this workspace root. See deps/README.md. (bindgen also needs
# libclang on the host — LIBCLANG_PATH — which is environment-specific and not
# set here.)
PEIOS_LIB_DIR = { value = "deps/lib", relative = true }
PEIOS_INCLUDE = { value = "deps/include", relative = true }
PKM_UAPI = { value = "deps/include", relative = true }

# Deliberately NOT setting LD_LIBRARY_PATH here: cargo's [env] does not reach
# the binary cargo spawns, so it would be dead config. The built binaries carry
# no rpath on purpose (a packaged build resolves libpeios from the system
# path), which makes LD_LIBRARY_PATH=deps/lib a per-invocation requirement for
# running or testing locally. See deps/README.md.
