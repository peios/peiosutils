# Note: keep in mind that this file is completely ignored in several use-cases
# like e.g. out-of-tree builds ( https://github.com/rust-lang/cargo/issues/2930 ).
# For this reason this file should be avoided as much as possible when there are alternatives.

[target.x86_64-unknown-redox]
linker = "x86_64-unknown-redox-gcc"
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# See feat_external_libstdbuf in src/uu/stdbuf/Cargo.toml
LIBSTDBUF_DIR = "/usr/local/libexec/coreutils"

# libpeios is deliberately not located here. Production builds consume the
# declared dev.peios.libpeios-devel package through pkg-config; developers may
# either install that package or use peios-sys's documented PEIOS_LIB_DIR,
# PEIOS_INCLUDE and PKM_UAPI overrides for an explicit local checkout.
