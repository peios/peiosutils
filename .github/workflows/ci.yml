# CI for peiosutils.
#
# The workspace links libpeios: the Peios-native applets (token, sd, reg,
# logonse, mount, feat) bind its C ABI through peios-sys, whose build
# script needs the library, its headers and the PKM UAPI headers. Without
# them `cargo check --workspace` fails in the build script before a line
# of peiosutils compiles — which is what this workflow did on every run
# from June to September 2026 while two releases were cut underneath it.
#
# The library is built here from the released revision named below. The
# pin used to be read out of the packaging recipe (pekit.toml), which
# vendored libpeios itself; since 56c012012 the recipe takes libpeios from
# the package catalogue and names no revision, and this workflow went on
# reading one that was no longer there — so it failed before building
# anything, on every push, while 0.8.13 to 0.8.15 were cut underneath it.
# The pin is this workflow's own now; move it when the tree needs a newer
# libpeios.
#
# Building libpeios materialises the pkm checkout its lockfile pins in
# Cargo's git cache, which is where the UAPI headers come from, so the
# pkm revision is read from that lockfile and there is still one pin.
# Nothing here is a substitute for the recipe's own test run inside the
# packaging build; it is the gate that runs on every push.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # libpeios v0.5.4.
  LIBPEIOS_REV: 953081d2c54a30fe14068551e51a5b9ee036314e

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            libpeios

      # bindgen (peios-sys) needs libclang; the freestanding headers
      # (stddef.h, stdint.h) come from gcc's own include dir, which
      # libclang does not find on its own.
      - name: Install bindgen prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libclang-dev

      - name: Build libpeios at the pinned revision
        run: |
          set -eu
          git clone --filter=blob:none --no-checkout https://github.com/peios/libpeios.git libpeios
          git -C libpeios checkout --detach "$LIBPEIOS_REV"
          # Exactly one pkm revision, or the lockfile is not what this
          # step takes it for.
          PKM_REV=$(sed -n 's|^source = "git+https://github.com/peios/pkm.git?rev=\([0-9a-f]\{40\}\)#.*|\1|p' libpeios/Cargo.lock | sort -u)
          test "$(printf '%s\n' "$PKM_REV" | grep -c .)" = 1
          cargo build --locked --manifest-path libpeios/Cargo.toml
          # The soname is libpeios.so.0; cargo writes only libpeios.so.
          ln -sf libpeios.so libpeios/target/debug/libpeios.so.0
          test -f libpeios/target/debug/libpeios.so.0

          # The UAPI headers: the pkm checkout libpeios's lockfile pinned,
          # which the build above just materialised.
          PKM_SHORT=$(printf %.7s "$PKM_REV")
          PKM_ROOT=
          for candidate in "$HOME"/.cargo/git/checkouts/pkm-*/"$PKM_SHORT"; do
            [ -d "$candidate/uapi/pkm" ] || continue
            PKM_ROOT=$candidate
          done
          test -n "$PKM_ROOT" || { echo "no pkm checkout at $PKM_REV in Cargo's git cache" >&2; exit 1; }
          test -f "$PKM_ROOT/uapi/pkm/pkm.h"

          {
            echo "PEIOS_LIB_DIR=$PWD/libpeios/target/debug"
            echo "PEIOS_INCLUDE=$PWD/libpeios/include"
            echo "PKM_UAPI=$PKM_ROOT/uapi"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)"
            # A dependency's rpath does not reach the multicall binary the
            # integration tests spawn; it has to find libpeios.so.0 at run time.
            echo "LD_LIBRARY_PATH=$PWD/libpeios/target/debug"
          } >> "$GITHUB_ENV"

      - name: cargo check (workspace, locked)
        run: cargo check --workspace --locked

      - name: cargo test (workspace, exclude GNU conformance)
        run: cargo test --workspace --locked --exclude uucore --no-fail-fast -- --skip gnu
