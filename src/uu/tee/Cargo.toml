[package]
name = "pu_tee"
description = "tee ~ (peiosutils) display input and copy to FILE"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/tee"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/tee.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
rustix = { workspace = true, features = ["stdio", "fs"] }
uucore = { workspace = true, features = ["fs", "parser", "signals"] }
fluent = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[[bin]]
name = "tee"
path = "src/main.rs"

[[bench]]
name = "tee_bench"
harness = false
