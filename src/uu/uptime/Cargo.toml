# spell-checker:ignore logind

[package]
name = "pu_uptime"
description = "uptime ~ (peiosutils) display dynamic system information"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/uptime"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
feat_systemd_logind = ["uucore/feat_systemd_logind"]

[lib]
path = "src/uptime.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["libc", "utmpx", "uptime"] }
fluent = { workspace = true }
jiff = { workspace = true }

[[bin]]
name = "uptime"
path = "src/main.rs"
