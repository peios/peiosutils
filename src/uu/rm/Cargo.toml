[package]
name = "pu_rm"
description = "rm ~ (peiosutils) remove PATHNAME"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/rm"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/rm.rs"
doctest = false

[dependencies]
thiserror = { workspace = true }
clap = { workspace = true }
uucore = { workspace = true, features = [
  "fs",
  "parser",
  "safe-traversal",
  "special-attributes",
] }
fluent = { workspace = true }
indicatif = { workspace = true }
libc = { workspace = true }
# Deleting through a handle: read-only files and --when-closed.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1" }

[[bin]]
name = "rm"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[[bench]]
name = "rm_bench"
harness = false
