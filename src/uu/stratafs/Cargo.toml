[package]
name = "pu_stratafs"
description = "stratafs ~ inspect and explain StrataFS mounts"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/stratafs"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/stratafs.rs"
doctest = false

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uucore = { workspace = true }
xattr = { workspace = true }

[[bin]]
name = "stratafs"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
