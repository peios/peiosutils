[package]
name = "pu_timeout"
description = "timeout ~ (peiosutils) run COMMAND with a DURATION time limit"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/timeout"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/timeout.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["parser", "process", "signals"] }
fluent = { workspace = true }
nix = { workspace = true, features = ["signal"] }

[[bin]]
name = "timeout"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[[bench]]
name = "timeout_bench"
harness = false
