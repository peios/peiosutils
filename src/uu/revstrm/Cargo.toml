# spell-checker:ignore (libs) libp msgpack revstrm

[package]
name = "pu_revstrm"
description = "revstrm ~ (peiosutils) print the raw KMES event stream for debugging"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/revstrm"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/revstrm.rs"
test = true
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
fluent = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
# Peios-native dependency: not coreutils, not tracked against upstream.
peios = { git = "https://github.com/peios/peios-rs.git", tag = "v0.2.0" }

[[bin]]
name = "revstrm"
path = "src/main.rs"
