# spell-checker:ignore (libs) libp msgpack revstrm

[package]
name = "pu_revstrm"
description = "revstrm ~ (peiosutils) print the raw KMES event stream for debugging"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/revstrm"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/revstrm.rs"
test = true
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
fluent = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
# The event catalogue, read for the declared type of each payload field. A
# library with no command line, so revstrm does not depend on the evman applet.
event-catalogue = { path = "../../../crates/event-catalogue" }
# Peios-native dependency: not coreutils, not tracked against upstream.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "26ac6968cec4cb7f887198aa3fb9268096660831" }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "revstrm"
path = "src/main.rs"
