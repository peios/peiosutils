[package]
name = "pu_realpath"
description = "realpath ~ (peiosutils) display resolved absolute path of PATHNAME"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/realpath"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/realpath.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs"] }
fluent = { workspace = true }

[[bin]]
name = "realpath"
path = "src/main.rs"
