[package]
name = "pu_pwd"
description = "pwd ~ (peiosutils) display current working directory"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/pwd"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/pwd.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
fluent = { workspace = true }

[[bin]]
name = "pwd"
path = "src/main.rs"
