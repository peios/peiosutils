[package]
name = "pu_rmdir"
description = "rmdir ~ (peiosutils) remove empty DIRECTORY"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/rmdir"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/rmdir.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs"] }
libc = { workspace = true }
fluent = { workspace = true }

[[bin]]
name = "rmdir"
path = "src/main.rs"
