# spell-checker:ignore logind

[package]
name = "pu_pinky"
description = "pinky ~ (peiosutils) display user information"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/pinky"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
feat_systemd_logind = ["uucore/feat_systemd_logind"]

[lib]
path = "src/pinky.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["utmpx", "entries"] }
fluent = { workspace = true }

[[bin]]
name = "pinky"
path = "src/main.rs"
