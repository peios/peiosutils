[package]
name = "pu_nohup"
description = "nohup ~ (peiosutils) run COMMAND, ignoring hangup signals"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/nohup"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/nohup.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "stdio"] }
uucore = { workspace = true, features = ["fs", "sd-control"] }
thiserror = { workspace = true }
fluent = { workspace = true }

[[bin]]
name = "nohup"
path = "src/main.rs"
