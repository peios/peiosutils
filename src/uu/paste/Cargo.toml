[package]
name = "pu_paste"
description = "paste ~ (peiosutils) merge lines from inputs"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/paste"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/paste.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["i18n-charmap"] }
fluent = { workspace = true }

[[bin]]
name = "paste"
path = "src/main.rs"
