[package]
name = "pu_tty"
description = "tty ~ (peiosutils) display the name of the terminal connected to standard input"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/tty"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/tty.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs"] }
fluent = { workspace = true }
rustix = { workspace = true, features = ["fs", "termios"] }

[[bin]]
name = "tty"
path = "src/main.rs"
