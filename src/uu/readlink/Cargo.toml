[package]
name = "pu_readlink"
description = "readlink ~ (peiosutils) display resolved path of PATHNAME"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/readlink"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/readlink.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs"] }
fluent = { workspace = true }

[[bin]]
name = "readlink"
path = "src/main.rs"
