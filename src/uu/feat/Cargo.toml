[package]
name = "pu_feat"
description = "feat ~ (peiosutils) install/enable Peios features (the imperative layer above packages)"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/feat"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/feat.rs"
doctest = false

[dependencies]
clap = { workspace = true }
libc = { workspace = true }
serde_json = "1"
toml = "0.8"
uucore = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e" }
peios-sys = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e" }

[[bin]]
name = "feat"
path = "src/main.rs"
