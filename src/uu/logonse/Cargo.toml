[package]
name = "pu_logonse"
description = "logonse ~ (peiosutils) Peios logon-session lifecycle and PSB"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/logonse"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/logonse.rs"
doctest = false

[dependencies]
peios-auth = { git = "https://github.com/peios/authd.git", rev = "70e1b852d6caef635ba296e58a91f19072f6c8ba" }
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "55fee6acb5ff23b97296d97ee966fa7c9f30a173" }

[[bin]]
name = "logonse"
path = "src/main.rs"

[dev-dependencies]
auth-core = { git = "https://github.com/peios/authd.git", rev = "70e1b852d6caef635ba296e58a91f19072f6c8ba" }
tempfile = { workspace = true }
