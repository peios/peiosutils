[package]
name = "pu_logonse"
description = "logonse ~ (peiosutils) Peios logon-session lifecycle and PSB"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/logonse"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/logonse.rs"
doctest = false

[dependencies]
peios-auth = { git = "https://github.com/peios/authd.git", rev = "b2b4d18ab639dac0e2990f3ccdd8e718d544b353" }
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "7c05d93e82ddeae7c9c16c4bb21cfe5e5416ca7e" }

[[bin]]
name = "logonse"
path = "src/main.rs"

[dev-dependencies]
auth-core = { git = "https://github.com/peios/authd.git", rev = "b2b4d18ab639dac0e2990f3ccdd8e718d544b353" }
tempfile = { workspace = true }
