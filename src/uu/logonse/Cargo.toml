[package]
name = "pu_logonse"
description = "logonse ~ (peiosutils) Peios logon-session lifecycle and PSB"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/logonse"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/logonse.rs"
doctest = false

[dependencies]
peios-auth = { git = "https://github.com/peios/authd.git", rev = "a014fa4c74f17ce4f67ba964eefce33a1a3dbdfa" }
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "26ac6968cec4cb7f887198aa3fb9268096660831" }

[[bin]]
name = "logonse"
path = "src/main.rs"

[dev-dependencies]
auth-core = { git = "https://github.com/peios/authd.git", rev = "a014fa4c74f17ce4f67ba964eefce33a1a3dbdfa" }
tempfile = { workspace = true }
