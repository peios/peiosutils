[package]
name = "pu_logonse"
description = "logonse ~ (peiosutils) Peios logon-session lifecycle and PSB"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/logonse"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/logonse.rs"
doctest = false

[dependencies]
peios-auth = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3" }
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "623520bc0405fdd4526bab45f45882e7f19b1ab1" }

[[bin]]
name = "logonse"
path = "src/main.rs"

[dev-dependencies]
auth-core = { git = "https://github.com/peios/authd.git", rev = "327ce68648e1594331c88a457afb261f9000b4c3" }
tempfile = { workspace = true }
