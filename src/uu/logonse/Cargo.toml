[package]
name = "pu_logonse"
description = "logonse ~ (peiosutils) Peios logon-session lifecycle and PSB"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/logonse"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/logonse.rs"
doctest = false

[dependencies]
peios-auth = { git = "https://github.com/peios/authd.git", rev = "89dbfeccf77800a7cd287bde5aab6ba26201a680" }
clap = { workspace = true }
libc = { workspace = true }
uucore = { workspace = true, features = ["sid-render"] }
jiff = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c" }

[[bin]]
name = "logonse"
path = "src/main.rs"

[dev-dependencies]
auth-core = { git = "https://github.com/peios/authd.git", rev = "89dbfeccf77800a7cd287bde5aab6ba26201a680" }
tempfile = { workspace = true }
