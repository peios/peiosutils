[package]
name = "pu_uniq"
description = "uniq ~ (peiosutils) filter identical adjacent lines from input"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/uniq"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/uniq.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["parser"] }
fluent = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
uucore = { workspace = true, features = ["benchmark", "parser"] }

[[bin]]
name = "uniq"
path = "src/main.rs"

[[bench]]
name = "uniq_bench"
harness = false
