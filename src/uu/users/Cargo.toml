# spell-checker:ignore logind

[package]
name = "pu_users"
description = "users ~ (peiosutils) display names of currently logged-in users"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/users"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
feat_systemd_logind = ["uucore/feat_systemd_logind"]

[lib]
path = "src/users.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["utmpx"] }
fluent = { workspace = true }

[target.'cfg(target_os = "openbsd")'.dependencies]
utmp-classic = { workspace = true }

[[bin]]
name = "users"
path = "src/main.rs"
