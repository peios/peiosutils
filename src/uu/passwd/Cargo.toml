[package]
name = "pu_passwd"
description = "passwd ~ (peiosutils) change your own password"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/passwd"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/passwd.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
# The credential-change conversation (libauthd-client, which GUI apps share),
# the PGSS Logon types it speaks, and the terminal input `login` and `lps`
# share — all pinned to the one authd revision, since they reach libauthd by
# path inside that repository and must agree on one crate.
libauthd = { git = "https://github.com/peios/authd.git", rev = "650bc4ac31bae0f917254f02c8e64f08ee3bbec5" }
libauthd-client = { git = "https://github.com/peios/authd.git", rev = "650bc4ac31bae0f917254f02c8e64f08ee3bbec5" }
libtty = { git = "https://github.com/peios/authd.git", rev = "650bc4ac31bae0f917254f02c8e64f08ee3bbec5" }

[[bin]]
name = "passwd"
path = "src/main.rs"
