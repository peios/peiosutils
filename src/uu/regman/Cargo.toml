[package]
name = "pu_regman"
description = "regman ~ (peiosutils) the Peios registry manual"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/regman"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/regman.rs"
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
notify = { workspace = true }
# Reading the manual, which other programs take too.
libregman = { path = "libregman" }

[[bin]]
name = "regman"
path = "src/main.rs"
