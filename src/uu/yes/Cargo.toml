[package]
name = "pu_yes"
description = "yes ~ (peiosutils) repeatedly display a line with STRING (or 'y')"
repository = "https://github.com/peios/peiosutils/tree/main/src/uu/yes"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
path = "src/yes.rs"
doctest = false

[dependencies]
clap = { workspace = true }
itertools = { workspace = true }
fluent = { workspace = true }
rustix = { workspace = true, features = ["pipe"] }
uucore = { workspace = true, features = ["pipes"] }

[[bin]]
name = "yes"
path = "src/main.rs"
