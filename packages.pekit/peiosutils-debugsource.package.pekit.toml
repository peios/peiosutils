# peiosutils-debugsource — the peiosutils Rust sources referenced by the debug
# info, under /usr/src/debug/peiosutils, so gdb/debuginfod can show source lines
# (not just file:line). build.main rewrites the DWARF comp_dir to point here
# (debugedit) and stages exactly the referenced sources. Only this repo's own
# sources are staged — std / cargo-registry / the peios git-dep sources fall
# outside the build tree and are skipped.
#
# Pairs with peiosutils-debuginfo (the symbols); depends on it, since source
# without symbols is useless.

[package]
description = "Peios coreutils — debug sources"

[dependencies]
peiosutils-debuginfo = "{{version}}"

[files]
":usr/src/debug/**" = "usr/src/debug/"
