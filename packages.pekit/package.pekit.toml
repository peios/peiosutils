# Base metadata shared by the peiosutils package(s). Each
# <name>.package.pekit.toml inherits these fields and overrides its own
# description and file set. MIT-licensed (a uutils/coreutils fork; see LICENSE).

format = "peipkg"

[package]
# 0.1.4-9: mount's private libblkid shim is gone — the FFI now lives once, in
# uucore::blkid, shared by mount, lsblk and part. It was three near-identical
# copies of one dlopen wrapper; lsblk's went in 0.1.3-1 and this is the last.
#
# mount keeps its own error vocabulary, mapped at the call site, because §7's
# contract is stated in exit codes (32 for an unresolvable tag or an ambiguous
# probe, 2 for a missing library, 4 for a missing symbol, 1 for bad input) and
# those come from the MountError *kind*. Five new tests assert every message
# and code the old shim produced, since none of those arms is reachable through
# libblkid from a unit test.
#
# Two things the consolidation had to preserve rather than assume:
#   - Chain selection. mount probes with libblkid's DEFAULT chains; enabling
#     the partition chain (as lsblk and part do) would make blkid_do_safeprobe
#     propagate "ambiguous" from a partition-table disagreement, so a hybrid
#     MBR/GPT disk would fail `-t auto` over something irrelevant to the
#     filesystem being mounted. uucore now takes an explicit `Chains`.
#   - "No TYPE" is not "no signature". A clean probe yielding no TYPE is a
#     distinct §7 failure; uucore reports it as a None field, re-raised here.
#
# Fixes a latent bug in uucore while there: an unresolvable UUID=/LABEL= spec
# returned NoSignature, which reads as "no filesystem on it" rather than "no
# such device". It has its own variant now. part never noticed because it does
# not resolve specs.
#
# 0.1.3-6: `test` and `[` are in the userland at last. The applet was
# registering under its crate name: the uu_* -> pu_* fork rename left build.rs
# still matching "uu_test", so the map gained an entry called `pu_test` and `[`
# was never registered at all. Anything execing /usr/bin/test or /usr/bin/[
# rather than a shell builtin — find -exec, env, autotools-generated scripts —
# found nothing there. The semantics were already correct and documented:
# -r/-w/-x are live KACS access checks against the file's security descriptor,
# and -O/-G/-u/-g/-k report decorative inode fields that carry no authority;
# --help now says the latter out loud instead of claiming POSIX ownership.
# (PEI-201)
#
# 0.1.3-4: part no longer fstats a device node to decide whether it is one.
# `stat` is denied to a caller who can read the device perfectly well —
# `dd if=/dev/vdb` works where the stat did not — and sysfs answers the
# question without touching the node. (This note originally blamed a
# descriptor "granting 0xF, no READ_ATTRIBUTES"; that was a misreading of
# `sd show`'s short-form `f`, which is FILE_ALL. The denial is real, the cause
# is still open: PEI-196.)
# Also: `part list` aligns type and name into columns, and an unopenable device
# reports why (no medium / not permitted / busy) instead of a bare "?".
#
# 0.1.3-3: part carries a table's own entry-array geometry instead of assuming
# its own. 128 entries is the spec MINIMUM, not the maximum — the Peios ISO
# declares 248 — so the fixed-size array read reported a valid table as damaged,
# and an edit would have silently shrunk it, discarding entries past 128 and
# moving first_usable under existing partitions.
#
# 0.1.3-2: `part list` with no device lists every disk and its partitions.
# Structure comes from sysfs, so a disk carrying a table part cannot manage
# still lists correctly, and an unreadable disk is still shown rather than
# dropped.
#
# 0.1.3: new `part` applet — GPT partitioning, so Peios can create the
# partitions it already knew how to format and boot from. A minor bump rather
# than a revision because it adds a command, not a fix. The libblkid dlopen
# shim moved from src/uu/lsblk/src/blkid.rs into uucore::blkid at the same
# time: lsblk and part now share it, and pu_mount's own copy is the last one
# left (see PEI-192).
#
# -3: cp treats a source filesystem with no extended attributes at all as
# "nothing to preserve" rather than a hard error. squashfs images built with no
# xattr table answer ENOTSUP for every inode type that carries a listxattr op,
# and overlayfs forwards that verbatim — so `cp -a` used to abort partway
# through any tree rooted on the live root. Scoped to the listing: ENOTSUP from
# the destination side is still a real failure to preserve. (PEI-180)
#
# -2: cp no longer follows a symlink when copying its security descriptor.
# It was reading and writing the TARGET's descriptor, which fails with ENOENT
# whenever the target has not been copied yet — as `/init -> usr/bin/peinit2`
# has not, when `/init` is reached long before `/usr`.
#
# -5: mkirf gains the `contributes` and `after` ordering keys, writes versioned
# hook sequences to /system/prelude/hooks.seq.<n>, and discovers hooks in
# /usr/libexec/prelude/hooks.d and /lcl/libexec/prelude/hooks.d as well as the
# legacy /hooks. This one is not optional for an image whose hook packages have
# already moved: an older mkirf scans only /hooks, finds nothing there, and
# writes an empty sequence — so the boot runs no hooks at all.
version      = "{{version}}-9"
architecture = "x86_64"
license      = "MIT"
homepage     = "https://github.com/peios/peiosutils"
