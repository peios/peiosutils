# Shared metadata for the qualified peiosutils package family. 0.8.0-1 is the
# first production release built against the libpeios 0.5 ABI baseline; each
# package fragment carries the migration from its unqualified predecessor.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT"
license_class = "free"
homepage      = "https://github.com/peios/peiosutils"
