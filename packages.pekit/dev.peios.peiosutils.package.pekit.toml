# Runtime multicall binary, one symlink per applet, and stdbuf's private
# triplet-scoped preload library. Documentation and translations remain
# optional in dev.peios.peiosutils-common.

[package]
name        = "dev.peios.peiosutils"
description = "Peios core utilities and native security, registry, storage and boot tools"
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND (0BSD OR Apache-2.0 OR MIT) AND Apache-2.0 AND (Apache-2.0 OR BSD-2-Clause OR MIT) AND (Apache-2.0 OR CC0-1.0 OR MIT-0) AND (Apache-2.0 OR GPL-2.0-only) AND (Apache-2.0 OR MIT) AND (Apache-2.0 OR MIT OR Zlib) AND (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT) AND BSD-2-Clause AND BSD-3-Clause AND CC0-1.0 AND (CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception) AND ISC AND MIT AND (MIT OR Unlicense) AND Unicode-3.0 AND Zlib"



[dependencies]
# mount and lsblk dlopen libblkid rather than gaining a DT_NEEDED entry.
"org.kernel.libblkid" = "*"

[files]
":licenses/**" = "usr/share/licenses/dev.peios.peiosutils/third-party"
"@source:LICENSE" = "usr/share/licenses/dev.peios.peiosutils/LICENSE"
":usr/bin/**"     = "usr/bin"
":usr/lib/x86_64-linux-peios/peiosutils/**" = "usr/lib/x86_64-linux-peios/peiosutils"
