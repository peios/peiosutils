[[advisory]]
id           = "GHSA-p29p-xpv8-mh7g"
applet       = "mv"
severity     = "low"
published    = "2026-07-29"
summary      = "mv: file ownership lost on cross-device moves"
upstream_fix = ""
status       = "accepted"
note         = """
By design, decided by jack 2026-09-09. A cross-device mv creates a new inode, and
on Peios a new inode takes its identity from where it is created: the security
descriptor re-inherits from the destination directory (the --preserve family
carries the source's), and the POSIX uid/gid are the creator's. KACS is the access
gate; uid/gid carry no authority, so there is nothing to preserve. What a plain
mv promises to carry is data, timestamps and ordinary xattrs (MV_DEFAULT).
Upstream's tests asserted that a chgrp'd group survived the move; they were red
at HEAD since peiosification removed the lchown. Rewritten as
test_mv_cross_device_carries_data_and_timestamps{,_recursive}, which assert the
Peios contract (data, mtime, and that the new inode is the caller's).
Knock-on closed at the same time: with ownership not carried, the copy must not
carry setuid/setgid either (upstream 37b1d11d0, GHSA-6c4j-6pgg-xgg8), or an
unprivileged cross-device mv of someone else's setuid file yields a setuid file
owned by the mover. mv now masks 0o6000 from the copied mode.
"""
resolved     = "2026-09-09"

