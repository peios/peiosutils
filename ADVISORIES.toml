branch on `!entry.local_to_target.exists()`, and `exists()` resolves symlinks, so
a destination entry that was itself a symlink to a directory looked like an
already-existing directory, the branch was skipped, and the traversal wrote the
source subtree through the link and out of the destination tree.

PORTED c1cddcc6c (PR #13624) verbatim into copy_direntry: added
`let dest_is_symlink = entry.local_to_target.is_symlink();` and changed the guard
to `if source_is_dir && (dest_is_symlink || !entry.local_to_target.exists())` /
`if entry.target_is_file || dest_is_symlink`, so a symlink at the destination is
treated as the non-directory it is and errors with
`cp-error-cannot-overwrite-non-directory-with-directory` (our en-US.ftl renders
"cannot overwrite non-directory with directory", which still satisfies the
upstream assertion). A symlinked directory named as the *target* itself stays
allowed. Also ported both upstream regression tests into tests/by-util/test_cp.rs
(test_cp_recursive_dest_subdir_symlink_not_followed,
test_cp_recursive_target_dir_symlink_still_allowed) plus the e05072e26
spell-checker "dstlink" addition.

NOT ported, deliberately: the advisory's second paragraph about
create_dest_restrictive(dest, false) lacking O_NOFOLLOW on the single-file data
open. The advisory's own "Correction affecting the related draft
GHSA-vwj2-hp86-chj8" retracts that half - following a symlinked file destination
is GNU's documented behaviour, and our src/uu/cp/src/platform/linux.rs fs_copy
already carries a comment saying exactly that. Flipping it would be a GNU
regression, not a fix.

VERIFIED: cargo check -p pu_cp clean.
`cargo test --no-default-features --features cp,install -- test_cp`:
344 tests, 306 pass / 38 fail. Baseline (same run with the new guard neutralised)
is 39 failures; the only delta is test_cp_recursive_dest_subdir_symlink_not_followed
flipping FAILED -> ok. The 38 remaining failures are pre-existing peiosification
fallout (mode/ownership preservation was removed from cp - e.g. test_preserve_mode,
test_cp_gnu_preserve_mode, test_cp_preserve_setuid_when_chown_succeeds,
test_dir_perm_race_with_preserve_mode_and_ownership), unrelated to this advisory.
Build env needed: PEIOS_LIB_DIR/PEIOS_INCLUDE/PKM_UAPI + BINDGEN_EXTRA_CLANG_ARGS
for clang builtin headers + LD_LIBRARY_PATH for libpeios.so.0.
