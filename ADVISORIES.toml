[[advisory]]
id           = "GHSA-rp9r-9vpg-388g"
applet       = "chroot"
severity     = "high"
published    = "2026-07-29"
summary      = "chroot --userspec: NSS module injection before privilege drop allows root code execution / chroot escape (glibc)"
upstream_fix = "f33bfb9321e5ebef0ef703aa6bfc8ee95bd21e1f"
status       = "fixed"
note         = """
Not exploitable as shipped, but the flawed ordering was still in our tree, so it was
fixed rather than waved through.
Exposure: our chroot is peiosified -- uumain refuses --userspec and --groups outright
(ChrootError::FlagNotSupported, exit 125) *before* set_context is ever called, because
Peios has no setuid-style identity transition yet. So the reachable path is always
UserSpec::None + groups None, which performs no name lookup at all; the NSS-injection
premise (getpwnam/getgrnam after chroot() dlopen'ing libnss_*.so.2 out of NEWROOT) had
no live call site, and nss-peios/authd never entered the picture.
Latent defect: set_context still called enter_chroot() first and only then
name_to_uid/name_to_gid/usr2gid/supplemental_gids -- the exact vulnerable ordering. The
file comment says the identity code is "kept below so the surface is ready when authd
lands", so leaving it would have re-armed the CVE the moment those flags are enabled.
Ported upstream f33bfb932 exactly: enter_chroot() moved to after all id resolution in
each of the four UserSpec arms, plus a comment recording why the order matters. No
behaviour change on the reachable path (the None arm resolves nothing either way).
Upstream added no regression test for this commit.
Verified: cargo check -p pu_chroot;
cargo test --no-default-features --features chroot -- test_chroot (18 passed).
"""
resolved     = "2026-09-09"

