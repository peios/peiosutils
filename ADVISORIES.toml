summary      = "uucore: safe_traversal TOCTOU protection only enabled on Linux"
upstream_fix = ""
status       = "not-affected"
note         = "Two independent reasons. (1) Peios is Linux-only, x86-64 — there is no macOS or FreeBSD target to lose the protection on, which is the entire impact of the advisory. (2) The narrow gate is not there anyway: our src/uucore/src/lib/features.rs declares `#[cfg(all(unix, not(target_os = \"redox\")))] pub mod safe_traversal;` (same cfg on the re-export in lib.rs), not `cfg(target_os = \"linux\")`, and rm's src/uu/rm/src/platform/mod.rs is unconditional. The only target_os = \"linux\" cfgs left inside safe_traversal.rs are statx/timestamp field details, not the fd-relative syscall path. NOTE — this worker DID change uucore for other advisories, all additive: fs::path_is_root_dir + root_file_information (GHSA-7cr3-h577-g38j), sd_control::CreatorSd::apply_to_created (GHSA-p5v9-q37h-pj8c; apply_to itself is unchanged, so no existing caller moves), and one new safe_traversal unit test (GHSA-32xv-mj27-3qgj). `cargo check -p uucore` and `cargo check -p pu_rm` pass. Still-vulnerable uucore code that is NOT mine to fix: perms.rs ChownExecutor::safe_traverse_dir descends with a hardcoded SymlinkBehavior::Follow (upstream b28655842 changes it to follow.into()) and perms::is_root uses the syntactic name check that upstream 7d844a76b replaces with path_is_root_dir — both belong to the chmod/chown/chgrp owner, who can now just call the helper I added."
resolved     = "2026-09-09"
