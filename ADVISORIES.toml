upstream_fix = "ca0c842e7"
status       = "fixed"
note         = "Affected — the fix landed 2026-06-01, after our fork point, and src/uu/touch/src/touch.rs still called File::create(path) (O_WRONLY|O_CREAT| O_TRUNC) after the metadata NotFound check, so a symlink planted in that window was followed and its target truncated. Peiosification did not touch this path. Ported ca0c842e7 in full: new create_without_truncate() using OpenOptions::new().write(true).create(true).truncate(false), called instead of File::create; dropped the now-unused File import and added CREAT to the spell-checker line. Ported all four upstream tests — unit tests create_without_truncate_does_not_truncate_existing_file and create_without_truncate_creates_missing_file, integration tests test_touch_does_not_truncate_symlink_target and test_touch_through_dangling_symlink_creates_target. NOT ported: the commit's util/check-safe-traversal.sh stanza (strace-checks that touch's openat carries O_CREAT and not O_TRUNC) — that file is outside the paths this worker may edit; coordinator should hand it to whoever owns util/. Left deliberately alone: the Peios --sd* step right after the create still uses CreatorSd::apply_to (follows symlinks), unlike mkdir/mkfifo/mknod which I moved to apply_to_created. That is correct here — touch through a dangling symlink creates the *target*, so the descriptor has to land on the target too; NoFollow would stamp the link. Tests: cargo check -p pu_touch; `cargo test --no-default-features --features touch -- test_touch` = 58 passed, 0 failed; `cargo test -p pu_touch` = 5 passed, 0 failed."
resolved     = "2026-09-09"

[[advisory]]
id           = "GHSA-g7j6-92cc-7hpv"
applet       = "tr"
severity     = "medium"
published    = "2026-07-29"
summary      = "tr: [:graph:] and [:print:] misclassify ASCII space"
upstream_fix = "358063f3367cb23a1e5db314cfdbfeb607749b3d"
status       = "not-affected"
note         = "Fix predates the fork. 358063f33 ('tr: fix graph/print character class mapping', PR #11405, 2026-03-26) is an ancestor of the fork point 873a7c752. In src/uu/tr/src/operation.rs the Class::Graph arm expands to 33..=126 only and Class::Print chains std::iter::once(32) for the space, which is the POSIX/GNU ordering. Advisory PoC on a locally built ./target/debug/tr: `printf 'a b\\n' | tr -d '[:graph:]'` gives `20 0a`, matching GNU. Differential-tested all 12 named classes (graph, print, punct, blank, space, alnum, alpha, cntrl, digit, lower, upper, xdigit) with -d over the input 'a b~\\t\\n': every one byte-identical to GNU tr. Upstream regression tests test_delete_graph_and_print_match_gnu and test_delete_complement_graph_and_print_match_gnu are present in tests/by-util/test_tr.rs. tr integration suite: 160 passed, 0 failed."
resolved     = "2026-09-09"

