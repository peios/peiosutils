[[advisory]]
id           = "GHSA-72j7-93r5-ffww"
applet       = "cp"
severity     = "low"
published    = "2026-07-29"
summary      = "cp: -p retains setuid/setgid bits when chown fails"
upstream_fix = "bd170a5d4b19ed985417d322dffb8cade2cbbad5"
status       = "not-affected"
note         = """
NOT AFFECTED twice over.

(1) The upstream fix bd170a5d4 ("cp: strip setuid/setgid when chown fails during
-p", #9750, 2026-04-21) is an ancestor of our fork point 873a7c752.

(2) More fundamentally, peiosification deleted the vulnerable machinery. Peios cp
has no chown(2) and no full-mode chmod: uucore::preserve::Attributes carries
owner / dacl / sacl / daclni / saclni / timestamps / links / security / xattrs /
exec and nothing else. Ownership is a KACS security-descriptor owner SID copied by
kacs_get_sd / kacs_set_sd, not a uid/gid chown, so there is no "chown failed"
branch that could leave stale mode bits behind. The only mode write in the whole
preserve path is apply_exec (preserve.rs:594-605), which reads the *destination's*
current mode and rewrites only bits 0o111
(`perms.set_mode((mode & !0o111) | if any_exec { 0o111 } else { 0 })`). The
source's setuid/setgid bits are never copied to the destination in the first
place, so they cannot be "retained". copydir.rs build_dir likewise creates
directories with default attributes and copies no mode.

VERIFIED: grep confirms no chown/setuid/setgid/S_ISUID/S_ISGID/0o7777 handling in
src/uu/cp/ or in uucore's preserve module; cargo check -p pu_cp clean. The
upstream test test_cp_preserve_setuid_when_chown_succeeds is one of the 38
pre-existing test_cp failures caused by mode preservation being removed - a known
peiosification divergence, not this advisory.
"""
resolved     = "2026-09-09"

[[advisory]]
id           = "GHSA-8r5f-98ww-c4c5"
applet       = "cp"
severity     = "high"
published    = "2026-09-05"
summary      = "cp -a chmods through an attacker-swapped destination symlink in copy_extended_attrs (TOCTOU) — an unprivileged user makes an arbitrary root-owned file world-writable"
upstream_fix = "6372fd3b239add19bf863f9d3f1d3c4c91276711"
status       = "fixed"
note         = """
AFFECTED and now fixed, in uucore. Supersedes the `todo` entry in cp.toml, whose
analysis was right: peiosification moved the whole --preserve machinery into
src/uucore/src/lib/features/preserve.rs, so nothing in src/uu/cp/ had to change.

WHAT WAS WRONG. copy_attributes() re-resolved BOTH names for every step, all of
them after the data copy had already finished — an lstat, a chmod, a listxattr,
a getxattr, a setxattr and a kacs_get_sd/kacs_set_sd pair, each its own
path->inode lookup:
  - copy_xattrs_filtered: fs::symlink_metadata(dest) then
    perms.set_readonly(false) + fs::set_permissions(dest) to widen a read-only
    destination, and the same lstat/set_permissions pair again to restore it.
    chmod(2) follows symlinks, so a destination swapped for a symlink in that
    window took the destination's whole mode onto the link's target.
  - apply_exec: the SAME lstat-then-set_permissions pair, and this one is far
    more reachable than the advisory's — Attributes::IMPLICIT preserves exec
    best-effort, so it ran on EVERY plain `cp`, not just --preserve=xattr with a
    pre-existing read-only destination. The advisory understates the exposure.
  - copy_attributes' SD copy: peios::file::get_sd/set_sd with dirfd=None
    (AT_FDCWD) and at_flags keyed off dest.is_symlink(), i.e. 0 for a regular
    destination — the same race in Peios-native form, writing owner/DACL/SACL
    rather than mode bits.
  - filetime::set_file_times(dest) — utimes by path, follows.
  (The xattr calls were the least of it: the `xattr` crate's non-`_deref`
  functions are already l*xattr, so a swapped-in symlink got the setxattr on the
  link, not its target. A swapped-in hard link to another inode still worked.)

WHAT WAS DONE. New internal `FileHandle` in preserve.rs: each end of the copy is
resolved exactly once, with O_NOFOLLOW, and every later step runs off that
descriptor — fstat, fchmod (File::set_permissions), f{list,get,set}xattr (the
xattr crate's FileExt), peios::file::fd_{get,set}_sd, and
filetime::set_file_handle_times. copy_extended_attrs / copy_security_xattrs /
copy_xattrs_filtered / apply_exec / copy_attributes all take handles now; the
public signature `copy_attributes(&Path, &Path, &Attributes)` is unchanged, so
cp and mv are untouched by this half.
  - Only regular files and directories are opened. A symlink cannot be opened
    for I/O, a socket cannot be opened at all (ENXIO), and opening a FIFO blocks
    or a device node is visible to its driver. Those keep the PATH forms, but
    only the unredirectable ones: AT_SYMLINK_NOFOLLOW for the SD, l*xattr for
    xattrs, utimensat(AT_SYMLINK_NOFOLLOW) for timestamps — and NO chmod at all
    (FileHandle::set_mode is a documented no-op without a descriptor). There is
    now no path-based chmod anywhere in the module.
  - If the O_NOFOLLOW open returns ELOOP on something the lstat just saw as a
    regular file or directory, the name was swapped in between: copy_attributes
    fails closed with "<path>: replaced by a symbolic link while copying;
    refusing to preserve attributes through it".
  - Directories are opened O_RDONLY|O_DIRECTORY (a directory cannot be opened
    for writing, and fsetxattr checks write permission on the inode rather than
    the open mode — upstream 6372fd3b2 makes the same point). A regular file
    that refuses O_RDONLY with EACCES is retried O_WRONLY.
  - The SD at_flags used to be keyed off dest.is_symlink() for BOTH sides; each
    end now answers for itself, which is the same answer without the coupling.

UPSTREAM. 6372fd3b2 (#10545) is the only related commit and it is a PARTIAL fix:
it moved the xattr list/get/set onto fds in cp and mv and left the chmod by path
(uutils-upstream/main HEAD bebeb9b4d still has the lstat/set_permissions pair at
cp.rs:1802-1813 and 1834-1836). It also does not apply to our tree — our xattr
loop is in uucore, not cp. Its regression test WAS ported, as
test_mv_cross_device_dir_xattr_preserved (it pins the read-only directory open,
which is exactly what our fd change could have broken). The chmod half has no
upstream fix; the design above is ours.

TESTS ADDED
  src/uucore/src/lib/features/preserve.rs (unit, deterministic — they pin the
  inode, then swap the name for a symlink to a victim, then act through the
  handle):
    chmod_through_a_handle_cannot_be_redirected_by_a_swap
    xattrs_through_a_handle_cannot_be_redirected_by_a_swap
    a_symlink_end_is_not_opened_and_is_never_chmodded
    a_read_only_regular_file_is_still_pinned
    a_directory_end_is_pinned_read_only
  tests/by-util/test_cp.rs:
    test_cp_preserve_exec_through_dest_fd (the chmod still lands, both ways)
    test_cp_attribute_phase_does_not_chmod_through_swapped_dest (the
      chmod-by-path case the brief asked for: a racer thread swaps the
      destination for a symlink to a 0444 victim across 40 `cp -f` runs and the
      victim's mode must never move. Racy by construction, but the assertion is
      only ever "the victim was not touched", so a lost race is a quiet pass and
      it can fail only if the bug returns.)
  tests/by-util/test_mv.rs:
    test_mv_cross_device_dir_xattr_preserved (ported from 6372fd3b2)

VERIFIED
  cargo check -p uucore -p pu_cp -p pu_mv -p pu_ln          -> clean, no warnings
  cargo clippy on the same                                  -> 1 warning, pre-existing
  cargo test -p uucore --features preserve,backup-control,fs
      -> 143 lib tests + 30 doctests, 0 failed
  cargo test --no-default-features --features cp,install,mv,ln -- test_cp test_mv test_ln
      -> 490 passed, 40 failed, 1 ignored. The 40 are exactly the recorded
         baseline: the 38 pre-existing test_cp failures from peiosification
         (mode/ownership preservation removed — `--preserve=mode` is not even a
         valid value any more, so test_cp_fifo/test_cp_socket fail at argument
         parsing) plus the 2 test_mv ownership failures of GHSA-p29p-xpv8-mh7g.
         Every new test passes and nothing regressed.
  Manually against target/debug/peiosutils on real files: xattrs preserved onto a
  fresh file, onto a directory, and onto a pre-existing destination; exec
  preserved (`cp --preserve=exec` and plain `cp` set the bits, a non-executable
  source clears them); a symlinked destination leaves its target's mode alone.

NOT FIXED, DELIBERATELY, ALL PRE-EXISTING AND SHARED WITH UPSTREAM — for the
coordinator to route:
  1. src/uu/cp/src/cp.rs: on a preserve failure cp truncates the destination with
     `fs::File::create(dest)`. That is a path open with O_WRONLY|O_CREAT|O_TRUNC:
     it FOLLOWS a symlink at the destination (same shape as this advisory) and it
     BLOCKS FOREVER on a FIFO destination. Reproduced: `cp --preserve=owner -r
     fifo fifo2` on a host without KACS hangs; strace shows the SD syscall
     returning ENOSYS and then openat(O_WRONLY|O_CREAT|O_TRUNC) on the fifo
     never returning. Upstream has the identical code and no fix.
  2. src/uu/cp/src/cp.rs CopyMode::AttrOnly does
     `OpenOptions::new().write(true).create(true).open(dest).unwrap()` —
     `cp --attributes-only` onto a 0444 destination PANICS (exit 101). Also
     umask-derived rather than restrictive; noted in cp.toml's GHSA-x5mh entry.
  3. uucore::preserve::dacl_is_protected still reads the SD by path with
     at_flags 0 (follows). It is a read-only probe feeding an mv warning, so
     nothing is written through the link; left alone to avoid changing which
     warnings mv emits for a symlink source.
"""
resolved     = "2026-09-09"

[[advisory]]
id           = "GHSA-8vrf-r662-2w2v"
applet       = "cp"
severity     = "medium"
published    = "2026-05-30"
summary      = "cp: -R reads device nodes as streams, destroying device semantics"
upstream_fix = "e6a3bb596f149628ba973eec3d099f3bb69f2464"
status       = "not-affected"
note         = """
NOT AFFECTED: the fix predates our fork point and survived peiosification intact.
Upstream e6a3bb596 ("cp: handle special files", #11163, 2026-03-05) is an
ancestor of 873a7c752, so the fork already had it.

Our src/uu/cp/src/cp.rs copy_helper still special-cases special files before any
stream read: under `options.recursive && !options.copy_contents` a socket goes to
copy_socket, a fifo to copy_fifo, and a char/block device to copy_node, which
recreates the node with nix mknod(2) using the source's rdev and mode. Only
--copy-contents (GNU's documented "read them as streams" opt-in) reaches
copy_stream. The upstream regression tests are present unmodified in
tests/by-util/test_cp.rs (test_cp_recursive_char_device,
test_cp_recursive_block_device, test_cp_recursive_char_device_copy_contents,
test_cp_recursive_char_device_no_permission); they self-skip without CAP_MKNOD.

VERIFIED behaviourally with the built target/debug/cp as an unprivileged user:
  cp -R /dev/null out                 -> "cannot create special file 'out':
                                          Operation not permitted" (mknod EPERM,
                                          no regular file produced)
  cp -R --copy-contents /dev/null out2 -> exit 0, regular file (opt-in stream path)
  mkfifo f1; cp -R f1 f2              -> f2 is a fifo (prw-rw-r--)
cargo check -p pu_cp clean; the 12 test_cp::test_cp_recursive* tests pass.
"""
resolved     = "2026-09-09"

[[advisory]]
id           = "GHSA-fqf6-gxhh-2xhw"
applet       = "cp"
severity     = "low"
published    = "2026-05-31"
summary      = "cp/install/mv/ln: --suffix alone does not enable backup mode (silent data loss vs GNU)"
upstream_fix = "939ab037a2eb24dc3263f1e9b82c838a30996fb2"
status       = "not-affected"
note         = """
THIS ENTRY COVERS cp ONLY. install, mv and ln are another worker's; nothing here
was changed on their behalf and no shared code was touched.

NOT AFFECTED: the fix predates our fork point. Upstream 939ab037a ("uucore: use
--suffix to enable backup mode", #9741, 2025-12-21) is an ancestor of 873a7c752,
and uucore::backup_control::determine_backup_mode in our tree still carries the
`--suffix`-alone branch (backup_control.rs:368-375): when OPT_SUFFIX is present
without --backup/-b it resolves the mode from $VERSION_CONTROL, defaulting to
BackupMode::Existing. The upstream regression tests
test_backup_mode_suffix_without_backup_option and
..._with_env_var are present at backup_control.rs:667 and :678.

On the cp side there is no second gate to remove: Options::from_matches
(cp.rs:838) calls determine_backup_mode(matches) unconditionally and uses whatever
it returns, so cp cannot suppress the suffix-derived mode. (Upstream's later
125712fc9 "backup_control: own the mode gate instead of leaving it to each caller"
is a refactor of the unrelated "backup would destroy source" guard, not of this;
our cp does not even have that guard, so it is out of scope.) The OPT_SUFFIX arg
has no clap default_value, so contains_id() is true only when the user actually
passed -S/--suffix and a bare `cp src dest` still makes no backup.

VERIFIED behaviourally with target/debug/cp:
  cp --suffix=.bak src dest   -> dest.bak created, contains the old dest  (GNU parity)
  cp -S .bak2 src dest2       -> dest2.bak2 created
  cp src dest3                -> no backup file created (no false positives)
  VERSION_CONTROL=numbered cp --suffix=.bak src dest4 -> dest4.~1~  ($VERSION_CONTROL honoured)
cargo check -p pu_cp clean.
"""
resolved     = "2026-09-09"

[[advisory]]
id           = "GHSA-g9rr-phfh-gvwv"
applet       = "cp"
severity     = "medium"
published    = "2026-07-29"
summary      = "cp: TOCTOU symlink swap bypasses no-dereference intent (arbitrary file exfiltration)"
upstream_fix = "ef5d75228262d62f3ff2ad21d35323b1f6665820"
status       = "not-affected"
note         = """
NOT AFFECTED: the fix predates our fork point and peiosification kept it.
Upstream ef5d75228 ("cp: open source and dest with O_NOFOLLOW in no-dereference
mode", #10017, 2026-04-21) is an ancestor of 873a7c752.

The advisory's `File::open(&source)` in src/uu/cp/src/platform/linux.rs no longer
exists. Every source open in that file goes through
uucore::safe_copy::open_source(path, nofollow), and `nofollow` is threaded
through copy_on_write into clone / fs_copy / sparse_copy /
sparse_copy_without_hole / copy_stream / check_for_data /
check_sparse_detection - all eight call sites. copy_helper computes it as
`let nofollow = !options.dereference(source_in_command_line);`, i.e. exactly when
source_metadata came from lstat, so a swap to a symlink between the lstat and the
open yields ELOOP instead of a redirected read. open_source sets OFlags::NOFOLLOW
via rustix and is covered by uucore unit tests
(open_source_rejects_symlink_with_nofollow, safe_copy_file_nofollow_rejects_symlink_source).

Note the deliberate divergence on the *destination* side: our fs_copy passes
`nofollow = false` to create_dest_restrictive, with a comment saying GNU cp -d/-P
only forbid dereferencing on the source side. That matches current upstream HEAD
and the retraction published in GHSA-h85f-wcqc-8jf9; it is not part of this
advisory, which is source-side only.

VERIFIED: cargo check -p pu_cp clean; full test_cp run shows no regression
(see the GHSA-h85f entry for the pass/fail accounting).
"""
resolved     = "2026-09-09"

