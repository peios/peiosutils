status       = "not-affected"
note         = """
NOT AFFECTED: the fix predates our fork point and peiosification kept it.
Upstream 681030bca ("cp: create destination with restrictive 0o600 initial mode",
#10011, 2026-04-21) is an ancestor of 873a7c752.

The advisory's `File::create()` (0o666 & ~umask, typically 0644) is gone from
src/uu/cp/src/platform/linux.rs. Every destination create there is
uucore::safe_copy::create_dest_restrictive, which opens with
O_WRONLY|O_CREAT|O_TRUNC|O_CLOEXEC and mode RUSR|WUSR = DEST_INITIAL_MODE 0o600,
so there is no window in which a shared-directory attacker can open the
destination while it is world-readable. This covers fs_copy, clone,
sparse_copy, sparse_copy_without_hole and copy_stream; the copy_stream comment
explicitly records that the old `0o622 & !umask` form was replaced for this
reason ("See #10011"). uucore unit test
create_dest_uses_restrictive_initial_mode pins the 0o600.

Peios strengthens this further: the --preserve machinery has no `mode` attribute
at all, so cp never widens the destination back to a umask-derived mode - the
only mode write is uucore::preserve::apply_exec, which touches the 0o111 bits of
the *destination's current* mode and nothing else.

Residual, out of scope for this advisory: an existing destination inode keeps its
own mode across O_TRUNC (documented on create_dest_restrictive, and matching GNU),
and --attributes-only in handle_copy_mode still uses a plain
OpenOptions::create().open(dest), which is umask-derived - but that path writes no
content, so it cannot leak file contents.

VERIFIED: cargo check -p pu_cp clean. Behaviourally, target/debug/cp copying into
a fresh destination leaves it mode 0600 (`-rw-------`) as expected.
"""
resolved     = "2026-09-09"

