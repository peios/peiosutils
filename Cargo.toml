[workspace]
resolver = "2"
members  = ["tools/*/*", "crates/*"]

[workspace.package]
edition  = "2021"
license  = "MIT"
publish  = false

# Single-package metadata: every workspace member's binary lands in one
# .peipkg ("peiosutils"). Per-tool `[package.metadata.peios].install_path`
# still controls *where* inside the package each binary goes.
[workspace.metadata.peios.package]
name        = "peiosutils"
version     = "0.0.1"
description = "Peios core userspace utilities (whoami, show-sd, revstrm, transitional protoinit)"
license     = "MIT"

[workspace.dependencies]
# Pinned to a pkm tag for reproducibility. Bump as the kernel ABI evolves.
# The peios-uapi crate's own SemVer (currently 0.19.0) tracks ABI changes,
# independent of the pkm repo tag — see "Versioning" in README.
peios-uapi = { git = "https://github.com/peios/pkm", tag = "v0.20.0-alpha1" }

# Power-user local override: if you're iterating on peios-uapi simultaneously,
# add this stanza to your USER-GLOBAL ~/.cargo/config.toml (NOT here):
#
#   [patch."https://github.com/peios/pkm"]
#   peios-uapi = { path = "/abs/path/to/pkm/crates/peios-uapi" }
#
# Cargo merges user-global config into every project. Keeping the patch out
# of this committed file means the farm builds cleanly off the pinned tag.

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
