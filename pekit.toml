"org.llvm.clang-devel"     = ">= 22.1.8"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"

[test.dependencies.apt]
"dev.peios.libpeios"       = ">= 0.5.0"
"dev.peios.libpeios-devel" = ">= 0.5.0"
"dev.peios.kernel-headers" = "*"
dash           = "*"
coreutils      = "*"
findutils      = "*"
grep           = "*"
sed            = "*"
cargo          = "*"
rustc          = "*"
gcc            = "*"
binutils       = "*"
debugedit      = "*"
"libclang-dev" = "*"
pkgconf        = "*"
[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"dev.peios.peiosutils"     = "*"
# install -m
"org.gnu.coreutils-build-compat" = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc"              = ">= 16"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.llvm.clang-devel"     = ">= 22.1.8"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"

[build.main.dependencies.apt]
# The libpeios SDK and PKM UAPI headers come from the signed catalogue
# (pkgs/_debroot_); Debian has no Peios ABI packages.
