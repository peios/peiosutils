# peiosutils — the Peios coreutils: GNU-coreutils-compatible file/text utilities
# (a uutils fork) plus the Peios-native KACS tools (token, sd, logonse, revstrm)
# and the SD-aware file utilities. Packaged as a single multi-call binary
# (`coreutils`) with one symlink per applet in /usr/bin, busybox-style.
#
# The Peios-native + SD-aware tools link libpeios (the userspace C ABI) through
# the `peios` crate, so the build needs libpeios's headers + .so (peios-sys
# bindgens against the headers and links the runtime object) and clang (for
# bindgen). libpeios is supplied by the vendored deps/ tree (deps/refresh.sh) —
# the build bridge until the root self-hosts libpeios-devel + kernel-headers;
# .cargo/config.toml points peios-sys at it via relative PEIOS_* env. When those
# packages exist, drop deps/ and let peios-sys resolve via the shipped peios.pc.

out_dir = "out"

[build.main]
command = """
set -eu
set -o pipefail 2>/dev/null || true

for tool in cargo rustc gcc; do
  command -v "$tool" >/dev/null || { echo "missing required peiosutils build tool: $tool" >&2; exit 1; }
done

# libpeios comes from the vendored deps/ tree (headers + pkm uapi headers +
# libpeios.so) — the build bridge until the root self-hosts libpeios-devel +
# kernel-headers. peios-sys reads its location from .cargo/config.toml's relative
# PEIOS_* env (PEIOS_LIB_DIR=deps/lib, PEIOS_INCLUDE/PKM_UAPI=deps/include), so we
# only need to ensure the tree is populated. See deps/README.md.
[ -d deps/lib ] && [ -d deps/include/peios ] || {
  echo "deps/ is not vendored — run ./deps/refresh.sh (or LIBPEIOS=.. PKM=.. ./deps/refresh.sh)" >&2
  exit 1
}

# Full *nix applet set, one multi-call binary.
cargo build --release --locked --no-default-features --features feat_os_unix

BINDIR="usr/bin"
mkdir -p "$PEKIT_OUT/$BINDIR"
install -m 0755 target/release/peiosutils "$PEKIT_OUT/$BINDIR/coreutils"

# One symlink per applet -> the multi-call binary (busybox-style). The binary
# links libpeios, so enumerating applets needs libpeios.so.0 on the loader path
# (the vendored copy under deps/lib).
LD_LIBRARY_PATH="$PWD/deps/lib" target/release/peiosutils --list \
  | while IFS= read -r applet; do
      [ -n "$applet" ] || continue
      [ "$applet" = "coreutils" ] && continue
      ln -sf coreutils "$PEKIT_OUT/$BINDIR/$applet"
    done
"""

# Build deps. Rust toolchain (cargo + rustc) builds the workspace, gcc drives the
# final link, clang supplies libclang for peios-sys's bindgen run. libpeios's
# headers/.so come from the vendored deps/ tree (deps/refresh.sh) rather than a
# build-dep package, until the build root self-hosts libpeios-devel +
# kernel-headers — then drop deps/ and add those two here (peios-sys resolves via
# the shipped peios.pc).
[build.main.dependencies.peipkg]
cargo = "*"
rust = "*"
gcc = "*"
clang = "*"

[build.main.dependencies.apt]
cargo = "*"
rustc = "*"
gcc = "*"
"libclang-dev" = "*"

[clean]
command = "cargo clean"
